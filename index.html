function comparison(t,p){
 const pairs=NAMES.map((name,i)=>({name,you:t[i],figure:p.v[i],gap:Math.abs(t[i]-p.v[i])}));
 const close=[...pairs].sort((a,b)=>a.gap-b.gap).slice(0,2);
 const far=[...pairs].sort((a,b)=>b.gap-a.gap).slice(0,2);
 const similarities=close.map(x=>`${x.name}（你 ${x.you} / 人物 ${x.figure}）`).join('、');
 const differences=far.map(x=>`${x.name}（你 ${x.you} / 人物 ${x.figure}）`).join('、');
 return `<div class="compare"><p><b class="gold">你们比较接近：</b>${esc(similarities)}</p><p><b class="gold">你们差异较大：</b>${esc(differences)}</p><p class="small">上述数字来自本测试的虚构人物画像与答题规则，不代表对历史人物真实性格的测量。</p></div>`;
}

 const title=PORTRAIT_TITLES[p.name]||p.name;
 for(const lang of ['en','zh']){
  try{
   const url=`https://${lang}.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=800&titles=${encodeURIComponent(title)}&origin=*`;
   const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),5500);
   let data;try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)continue;data=await response.json()}finally{clearTimeout(timeout)}
   const pages=Object.values(data.query?.pages||{});const src=pages.find(x=>x.thumbnail?.source)?.thumbnail?.source;
   if(!src)continue;

function result(){const computed=calculate();if(!computed){stage=0;render();return;}const {t,ranked}=computed;const max=t.indexOf(Math.max(...t)),min=t.indexOf(Math.min(...t));const a=answers;let relationship=a[19]===1?'你格外重视少数人的深度信任与爱。':a[19]===3?'你倾向于把自由放在社会评价之前。':'你希望在亲密关系和个人成就之间找到自己的位置。';let career=t[2]>75?'你可能更喜欢目标明确、成长空间较大的职业环境。':'你可能更适合能持续积累技能、并兼顾个人价值的工作环境。';let risk=a[20]===2?'面对投入很久却不再适合的目标，你可能较难及时放手。':a[20]===0?'你可能需要留意沉没成本对选择的影响。':'你已经表现出一定的调整方向意识，仍值得定期审视长期目标。';let core=t[2]>t[1]?'进取与自主':'联结与成长';$('#app').innerHTML=`<div class="panel"><div class="eyebrow">你的专属探索报告 · 24/24</div><p class="small">${profile.gender?`性别：${esc(profile.gender)}　·　`:``}MBTI：${profile.mbti?esc(profile.mbti):`未填写`}</p><h1>${core}的<span class="gold">历史回响</span></h1><p class="muted">你的回答呈现出多种并存的倾向，下面是基于24道情境题的解释性画像。</p><div class="profile"><label for="result-gender">历史人物匹配性别（可随时更改，无需重新答题）</label><select id="result-gender"><option value="">不限性别</option>${['女','男','其他','不愿透露'].map(x=>`<option value="${x}" ${profile.gender===x?'selected':''}>${x}</option>`).join('')}</select><label for="result-mbti">你的 MBTI（可更改并立即重新匹配）</label><select id="result-mbti"><option value="">不知道 / 未测试 / 跳过</option>${MBTIS.map(x=>`<option value="${x}" ${profile.mbti===x?'selected':''}>${x}</option>`).join('')}</select><small>性别筛选候选人物；填写的 MBTI 参与人物排名，但不会改变24题的八维得分。</small></div><div class="note">人物候选范围根据你填写的性别筛选；选择其他、不愿透露或跳过时不限制性别。填写 MBTI 时，八维答题占80%，四字母偏好一致程度占20%；未填写时答题占100%。历史人物 MBTI 为推测性娱乐标签。八维得分经过各维理论范围归一化，匹配分根据八维距离计算。人物相似度是本网页自定义规则生成的娱乐性分数，不能当作经验证的心理学百分比，也不能证明你与历史人物拥有相同人格。</div><h2 style="margin-top:28px">八维人格雷达图</h2><canvas id="radar" width="360" height="340" role="img" aria-label="八维人格雷达图"></canvas>${NAMES.map((n,i)=>`<div class="trait"><div class="row"><span>${n}</span><strong>${t[i]}/100</strong></div><div class="track"><div class="fill" style="width:${t[i]}%"></div></div></div>`).join('')}<h2 style="margin-top:32px">最相似的三位历史人物</h2>${ranked.slice(0,3).map((p,i)=>`<div class="person"><span class="rank">TOP ${i+1} · 探索性相似度 ${p.score}%</span><h3>${esc(p.name)} · ${esc(p.label)}</h3><p class="small">人物参考 MBTI：<b>${esc(p.mbti)}</b>${p.mbtiMatches===null?' · 你未填写 MBTI，未参与评分':` · 与你的 ${esc(profile.mbti)} 一致 ${p.mbtiMatches}/4 维 · 答题匹配 ${p.questionScore} 分 · MBTI 匹配 ${p.mbtiScore} 分`}</p><p class="muted">${esc(p.about)}</p><div class="small">相似主题：${esc(p.strength)}<br>值得留意：${esc(p.risk)}</div><details class="person-fold" ${i===0?'open':''}><summary>查看与${esc(p.name)}的详细匹配分析</summary><div class="fold-body">${comparison(t,p)}${historicalStory(p)}<div class="compare"><p><b class="gold">人物优势分析</b></p><p class="muted">${esc(characterAdvice(p,t).adv)}</p><p><b class="gold">成长建议</b></p><p class="muted">${esc(characterAdvice(p,t).grow)}</p></div></div></details></div>`).join('')}<h2>你的专属人格分析</h2><p class="muted">以下建议根据你的八维答题得分生成，不是照搬历史人物的性格描述。</p>${personalInsights(t)}<h2>你的优势与成长空间</h2><p class="muted"><b class="gold">突出倾向：</b>${NAMES[max]}是你当前得分最高的维度之一。这可能成为你应对变化的重要资源。</p><p class="muted"><b class="gold">可探索的方向：</b>${NAMES[min]}相对较低，不代表能力不足，只说明在这套题目中相关选项出现较少。</p><p class="muted"><b class="gold">决策提醒：</b>${risk}</p><h2>感情与事业</h2><p class="muted"><b class="gold">情感模式：</b>${relationship}真实关系仍需结合沟通方式和具体经历判断。</p><p class="muted"><b class="gold">事业倾向：</b>${career}建议在选择机会时同时衡量成长、健康、关系和自由。</p><h2>给你的三条建议</h2><p class="muted">① 用真实经历检验测试标签，不必被单一人物定义。<br>② 面对重大选择时，写下自己的底线和退出条件。<br>③ 允许事业目标、亲密关系与生活幸福随着人生阶段变化。</p><div class="actions"><button class="btn" id="sharecard">生成结果分享卡</button><button class="btn secondary" id="share">分享测试链接</button><button class="btn secondary" id="copy">复制我的结果</button><button class="btn secondary" id="restart">重新测试</button></div><p class="small" id="status" aria-live="polite"></p></div>`;drawRadar(t);$('#result-gender').onchange=e=>{profile.gender=e.target.value;try{localStorage.setItem('history-echo-profile-v1',JSON.stringify(profile))}catch(err){}result()};$('#result-mbti').onchange=e=>{profile.mbti=e.target.value;try{localStorage.setItem('history-echo-profile-v1',JSO
