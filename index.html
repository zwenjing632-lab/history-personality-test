let answers=Array(24).fill(null),stage=-1;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MBTIS=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
let profile={gender:'',mbti:''};
try{const x=JSON.parse(localStorage.getItem('history-echo-profile-v1'));if(x&&typeof x==='object'){profile.gender=typeof x.gender==='string'?x.gender:'';profile.mbti=typeof x.mbti==='string'?x.mbti:''}}catch(e){}
function profileForm(){return `<div class="profile"><h3>关于你 <span class="muted" style="font-size:13px">（选填）</span></h3><div class="profile-grid"><div><label for="gender">性别</label><select id="gender"><option value="">请选择 / 跳过</option>${['女','男','其他','不愿透露'].map(x=>`<option value="${x}" ${profile.gender===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="mbti">MBTI 类型</label><select id="mbti"><option value="">不知道 / 未测试 / 跳过</option>${MBTIS.map(x=>`<option value="${x}" ${profile.mbti===x?'selected':''}>${x}</option>`).join('')}</select></div></div><small>这些信息只保存在你的浏览器，不上传服务器，不会改变八维人格评分；选择男性或女性会限定匹配人物的性别。MBTI 是自填资料，不是本测试测出的结果。</small></div>`}
function bindProfile(){for(const k of ['gender','mbti']){const el=$('#'+k);if(el)el.onchange=()=>{profile[k]=el.value;try{localStorage.setItem('history-echo-profile-v1',JSON.stringify(profile))}catch(e){}}}}
function restore(){try{const a=JSON.parse(localStorage.getItem('history-echo-v1'));if(Array.isArray(a)&&a.length===24)answers=a.map(x=>Number.isInteger(x)&&x>=0&&x<4?x:null)}catch(e){}}
function save(){try{localStorage.setItem('history-echo-v1',JSON.stringify(answers))}catch(e){}}
function render(){if(stage===-1)return home();if(stage===4)return result();quiz()}
function home(){$('#app').innerHTML=`<div class="panel"><span class="pill">24题 · 约8分钟 · 免费</span><h1>如果你生活在历史中，<span class="gold">会是谁？</span></h1><p class="muted">面对机会、竞争、亲密关系和人生抉择，你会做出怎样的选择？通过24道情境题，探索你的八维人格，并发现与你的价值取向相似的历史人物。</p><div class="note">没有正确答案，也无需填写姓名。结果只在你的设备上计算和保存。人物匹配属于探索性娱乐，不是科学心理测量。</div>${profileForm()}<div class="actions"><button class="btn" id="start">${answers.some(x=>x!==null)?'继续我的测试':'开始探索'}</button>${answers.some(x=>x!==null)?'<button class="btn secondary" id="reset">重新开始</button>':''}</div></div>`;bindProfile();$('#start').onclick=()=>{let i=answers.findIndex(x=>x===null);stage=i===-1?4:Math.floor(i/6);render()};if($('#reset'))$('#reset').onclick=()=>{if(confirm('确定清除本机答案并重新开始吗？')){answers=Array(24).fill(null);save();stage=0;render()}}}
function quiz(){let start=stage*6,end=start+6,count=answers.filter(x=>x!==null).length;$('#app').innerHTML=`<div class="panel"><div class="eyebrow">第 ${stage+1} 轮 / 共4轮</div><h2>${['真实决策方式','野心、原则与关系','内在性格与命运','核心人格与人生追求'][stage]}</h2><div class="muted">已回答 ${count}/24 题 · 请选择最接近真实反应的选项</div><div class="progress"><div style="width:${count/24*100}%"></div></div><div id="questions">${DATA.slice(start,end).map((item,i)=>{let id=start+i;return `<div class="question"><b>${id+1}. ${esc(item[0])}</b>${item[1].map((v,j)=>`<button class="option ${answers[id]===j?'selected':''}" data-id="${id}" data-opt="${j}" aria-pressed="${answers[id]===j}">${'ABCD'[j]}. ${esc(v)}</button>`).join('')}</div>`}).join('')}</div><div class="actions"><button class="btn secondary" id="prev">${stage===0?'返回首页':'上一轮'}</button><button class="btn" id="next" ${answers.slice(start,end).every(x=>x!==null)?'':'disabled'}>${stage===3?'查看我的人格报告':'进入下一轮 →'}</button></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.id]=+b.dataset.opt;save();quiz()});$('#prev').onclick=()=>{stage--;render()};$('#next').onclick=()=>{if(!answers.slice(start,end).every(x=>x!==null))return;stage++;render();scrollTo({top:0,behavior:'smooth'})}}
function calculate(){let t=Array(8).fill(0);answers.forEach((a,i)=>W[i][a].forEach((v,j)=>t[j]+=v));t=t.map(v=>Math.round(15+v/96*80));let eligible=(profile.gender==='男'||profile.gender==='女')?PEOPLE.filter(p=>p.gender===profile.gender):PEOPLE;let ranked=eligible.map(p=>{let d=p.v.reduce((s,v,i)=>s+Math.abs(v-t[i]),0)/8;return {...p,score:Math.max(40,Math.min(95,Math.round(100-d*.72)))}}).sort((a,b)=>b.score-a.score);return {t,ranked}}
function drawRadar(t){const c=$('#radar'),ctx=c.getContext('2d');let dpr=window.devicePixelRatio||1;c.width=360*dpr;c.height=340*dpr;ctx.scale(dpr,dpr);const cx=180,cy=169,r=112,n=8;ctx.clearRect(0,0,360,340);for(let ring=1;ring<=4;ring++){ctx.beginPath();for(let i=0;i<n;i++){let a=-Math.PI/2+i*Math.PI*2/n;let x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#46546b';ctx.stroke()}ctx.beginPath();t.forEach((v,i)=>{let a=-Math.PI/2+i*Math.PI*2/n,x=cx+Math.cos(a)*r*v/100,y=cy+Math.sin(a)*r*v/100;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#d9b77c55';ctx.fill();ctx.strokeStyle='#f0c986';ctx.lineWidth=2;ctx.stroke();ctx.font='12px system-ui';ctx.fillStyle='#e5eaf2';ctx.textAlign='center';NAMES.forEach((s,i)=>{let a=-Math.PI/2+i*Math.PI*2/n;ctx.fillText(s,cx+Math.cos(a)*(r+38),cy+Math.sin(a)*(r+27)+4)})}
function result(){const {t,ranked}=calculate();const max=t.indexOf(Math.max(...t)),min=t.indexOf(Math.min(...t));const a=answers;let relationship=a[19]===1?'你格外重视少数人的深度信任与爱。':a[19]===3?'你倾向于把自由放在社会评价之前。':'你希望在亲密关系和个人成就之间找到自己的位置。';let career=t[2]>75?'你可能更喜欢目标明确、成长空间较大的职业环境。':'你可能更适合能持续积累技能、并兼顾个人价值的工作环境。';let risk=a[20]===2?'面对投入很久却不再适合的目标，你可能较难及时放手。':a[20]===0?'你可能需要留意沉没成本对选择的影响。':'你已经表现出一定的调整方向意识，仍值得定期审视长期目标。';let core=t[2]>t[1]?'进取与自主':'联结与成长';$('#app').innerHTML=`<div class="panel"><div class="eyebrow">你的专属探索报告 · 24/24</div><p class="small">${profile.gender?`性别：${esc(profile.gender)}　·　`:``}MBTI：${profile.mbti?esc(profile.mbti):`未填写`}</p><h1>${core}的<span class="gold">历史回响</span></h1><p class="muted">你的回答呈现出多种并存的倾向，下面是基于24道情境题的解释性画像。</p><div class="note">人物候选范围根据你填写的性别筛选；选择其他、不愿透露或跳过时不限制性别。人物相似度是本网页自定义规则生成的娱乐性分数，不能当作经验证的心理学百分比，也不能证明你与历史人物拥有相同人格。</div><h2 style="margin-top:28px">八维人格雷达图</h2><canvas id="radar" width="360" height="340" role="img" aria-label="八维人格雷达图"></canvas>${NAMES.map((n,i)=>`<div class="trait"><div class="row"><span>${n}</span><strong>${t[i]}/100</strong></div><div class="track"><div class="fill" style="width:${t[i]}%"></div></div></div>`).join('')}<h2 style="margin-top:32px">最相似的三位历史人物</h2>${ranked.slice(0,3).map((p,i)=>`<div class="person"><span class="rank">TOP ${i+1} · 探索性相似度 ${p.score}%</span><h3>${esc(p.name)} · ${esc(p.label)}</h3><p class="muted">${esc(p.about)}</p><div class="small">相似主题：${esc(p.strength)}<br>值得留意：${esc(p.risk)}</div></div>`).join('')}<h2>你的优势与成长空间</h2><p class="muted"><b class="gold">突出倾向：</b>${NAMES[max]}是你当前得分最高的维度之一。这可能成为你应对变化的重要资源。</p><p class="muted"><b class="gold">可探索的方向：</b>${NAMES[min]}相对较低，不代表能力不足，只说明在这套题目中相关选项出现较少。</p><p class="muted"><b class="gold">决策提醒：</b>${risk}</p><h2>感情与事业</h2><p class="muted"><b class="gold">情感模式：</b>${relationship}真实关系仍需结合沟通方式和具体经历判断。</p><p class="muted"><b class="gold">事业倾向：</b>${career}建议在选择机会时同时衡量成长、健康、关系和自由。</p><h2>给你的三条建议</h2><p class="muted">① 用真实经历检验测试标签，不必被单一人物定义。<br>② 面对重大选择时，写下自己的底线和退出条件。<br>③ 允许事业目标、亲密关系与生活幸福随着人生阶段变化。</p><div class="actions"><button class="btn" id="share">分享这个测试</button><button class="btn secondary" id="copy">复制我的结果</button><button class="btn secondary" id="restart">重新测试</button></div><p class="small" id="status" aria-live="polite"></p></div>`;drawRadar(t);$('#restart').onclick=()=>{if(confirm('重新测试会清除当前答案，是否继续？')){answers=Array(24).fill(null);save();stage=0;render()}};$('#share').onclick=async()=>{let url=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:'历史回响｜24题人格探索',text:'来测测你最像哪位历史人物！',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$('#status').textContent='测试链接已复制。上传到网站后，这个链接就能发给朋友。'}else $('#status').textContent='分享地址：'+url}catch(e){if(e.name!=='AbortError')$('#status').textContent='请从浏览器地址栏复制链接。'}};$('#copy').onclick=async()=>{let s=`我的历史人物人格测试结果：${profile.mbti?`MBTI ${profile.mbti}；`:``}${ranked.slice(0,3).map(x=>x.name+' '+x.score+'%').join('、')}。八维人格：${NAMES.map((n,i)=>n+t[i]).join('、')}。测试入口：${location.href.split('#')[0]}`;try{await navigator.clipboard.writeText(s);$('#status').textContent='结果文字已复制！'}catch(e){$('#status').textContent=s}}}
window.startHistoricalQuiz=()=>{stage=0;render()};restore();render();
