function home(){$('#app').innerHTML=`<div class="panel"><span class="pill">24题 · 约8分钟 · 免费</span><h1>如果你生活在历史中，<span class="gold">会是谁？</span></h1><p class="muted">面对机会、竞争、亲密关系和人生抉择，你会做出怎样的选择？通过24道情境题，探索你的八维人格，并发现与你的价值取向相似的历史人物。</p><div class="note">没有正确答案，也无需填写姓名。结果只在你的设备上计算和保存。人物匹配属于探索性娱乐，不是科学心理测量。</div>${profileForm()}<div class="actions"><button class="btn" id="start">${answers.some(x=>x!==null)?'继续我的测试':'开始探索'}</button>${answers.some(x=>x!==null)?'<button class="btn secondary" id="reset">重新开始</button>':''}</div></div>`;bindProfile();$('#start').onclick=()=>{profile.gender=$('#gender')?.value||'';profile.mbti=$('#mbti')?.value||'';try{localStorage.setItem('history-echo-profile-v1',JSON.stringify(profile))}catch(e){}let i=answers.findIndex(x=>x===null);stage=i===-1?4:Math.floor(i/6);render()};if($('#reset'))$('#reset').onclick=()=>{if(confirm('确定清除本机答案并重新开始吗？')){answers=Array(24).fill(null);save();stage=0;render()}}}
function quiz(){let start=stage*6,end=start+6,count=answers.filter(x=>x!==null).length;$('#app').innerHTML=`<div class="panel"><div class="eyebrow">第 ${stage+1} 轮 / 共4轮</div><h2>${['真实决策方式','野心、原则与关系','内在性格与命运','核心人格与人生追求'][stage]}</h2><div class="muted">已回答 ${count}/24 题 · 请选择最接近真实反应的选项</div><div class="progress"><div style="width:${count/24*100}%"></div></div><div id="questions">${DATA.slice(start,end).map((item,i)=>{let id=start+i;return `<div class="question"><b>${id+1}. ${esc(item[0])}</b>${item[1].map((v,j)=>`<button class="option ${answers[id]===j?'selected':''}" data-id="${id}" data-opt="${j}" aria-pressed="${answers[id]===j}">${'ABCD'[j]}. ${esc(v)}</button>`).join('')}</div>`}).join('')}</div><div class="actions"><button class="btn secondary" id="prev">${stage===0?'返回首页':'上一轮'}</button><button class="btn" id="next" ${answers.slice(start,end).every(x=>x!==null)?'':'disabled'}>${stage===3?'查看我的人格报告':'进入下一轮 →'}</button></div></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[+b.dataset.id]=+b.dataset.opt;save();quiz()});$('#prev').onclick=()=>{stage--;render()};$('#next').onclick=()=>{if(!answers.slice(start,end).every(x=>x!==null))return;stage++;render();scrollTo({top:0,behavior:'smooth'})}}
function calculate(){let t=Array(8).fill(0);answers.forEach((a,i)=>W[i][a].forEach((v,j)=>t[j]+=v));t=t.map(v=>Math.round(15+v/96*80));let eligible=(profile.gender==='男'||profile.gender==='女')?PEOPLE.filter(p=>p.gender===profile.gender):PEOPLE;let ranked=eligible.map(p=>{let d=p.v.reduce((s,v,i)=>s+Math.abs(v-t[i]),0)/8;return {...p,score:Math.max(40,Math.min(95,Math.round(100-d*.72)))}}).sort((a,b)=>b.score-a.score);return {t,ranked}}
function drawRadar(t){const c=$('#radar'),ctx=c.getContext('2d');let dpr=window.devicePixelRatio||1;c.width=360*dpr;c.height=340*dpr;ctx.scale(dpr,dpr);const cx=180,cy=169,r=112,n=8;ctx.clearRect(0,0,360,340);for(let ring=1;ring<=4;ring++){ctx.beginPath();for(let i=0;i<n;i++){let a=-Math.PI/2+i*Math.PI*2/n;let x=cx+Math.cos(a)*r*ring/4,y=cy+Math.sin(a)*r*ring/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#e1e7f0';ctx.stroke()}ctx.beginPath();t.forEach((v,i)=>{let a=-Math.PI/2+i*Math.PI*2/n,x=cx+Math.cos(a)*r*v/100,y=cy+Math.sin(a)*r*v/100;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='#4b85eb36';ctx.fill();ctx.strokeStyle='#3778e8';ctx.lineWidth=2;ctx.stroke();ctx.font='12px system-ui';ctx.fillStyle='#385273';ctx.textAlign='center';NAMES.forEach((s,i)=>{let a=-Math.PI/2+i*Math.PI*2/n;ctx.fillText(s,cx+Math.cos(a)*(r+38),cy+Math.sin(a)*(r+27)+4)})}

 '为重要决定留下复盘时间，特别是涉及金钱、健康或关系时。快速执行很有价值，但有时多听一个不同意见，反而能节省后续成本。',
 '在探索新机会前，确认时间、预算与稳定关系的底线。新鲜感可以成为动力，但不必让每一次变化都变成必须抓住的机会。',
 '当情绪强烈时，先记录感受，再区分事实、猜测和担忧。不要要求自己立刻得出结论，也可以通过运动、交流或休息恢复判断力。'
];
function characterAdvice(p,t){
 const order=p.v.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
 const first=order[0].i,second=order[1].i;
 const lead=`从本测试的参考画像来看，${p.name}所代表的“${p.label}”类型，核心优势可以概括为${p.strength}。${p.about}`;
 const adv=`${lead}${DIM_ADV[first]}${DIM_ADV[second]}如果你与这位人物匹配度较高，不妨回想自己在学习、合作或重大选择中是否也表现过类似倾向。最值得保留的不是模仿历史人物的每个决定，而是把这些长处用在适合自己的环境里。你可以挑选一件近期任务，主动使用其中一项优势，并观察它实际带来了什么改变。`;
 const grow=`与这类人格画像相伴的挑战，往往是“${p.risk}”。这并不意味着你一定存在这个问题，而是提醒你在压力下留意自己的习惯。${DIM_GROW[first]}${DIM_GROW[second]}建议你从一项可操作的小改变开始：每周花十分钟记录一次让你满意的决定、一次想要调整的反应，以及下一周准备尝试的具体做法。成长不是抹去鲜明个性，而是在保留优势的同时，为自己增加更多选择。`;
 return {adv,grow};
}

function comparison(t,p){
 const pairs=NAMES.map((name,i)=>({name,you:t[i],figure:p.v[i],gap:Math.abs(t[i]-p.v[i])}));
 const close=[...pairs].sort((a,b)=>a.gap-b.gap).slice(0,2);
 const far=[...pairs].sort((a,b)=>b.gap-a.gap).slice(0,2);
 const similarities=close.map(x=>`${x.name}（你 ${x.you} / 人物 ${x.figure}）`).join('、');
 const differences=far.map(x=>`${x.name}（你 ${x.you} / 人物 ${x.figure}）`).join('、');
 return `<div class="compare"><p><b class="gold">你们比较接近：</b>${esc(similarities)}</p><p><b class="gold">你们差异较大：</b>${esc(differences)}</p><p class="small">上述数字来自本测试的虚构人物画像与答题规则，不代表对历史人物真实性格的测量。</p></div>`;
}
function result(){const {t,ranked}=calculate();const max=t.indexOf(Math.max(...t)),min=t.indexOf(Math.min(...t));const a=answers;let relationship=a[19]===1?'你格外重视少数人的深度信任与爱。':a[19]===3?'你倾向于把自由放在社会评价之前。':'你希望在亲密关系和个人成就之间找到自己的位置。';let career=t[2]>75?'你可能更喜欢目标明确、成长空间较大的职业环境。':'你可能更适合能持续积累技能、并兼顾个人价值的工作环境。';let risk=a[20]===2?'面对投入很久却不再适合的目标，你可能较难及时放手。':a[20]===0?'你可能需要留意沉没成本对选择的影响。':'你已经表现出一定的调整方向意识，仍值得定期审视长期目标。';let core=t[2]>t[1]?'进取与自主':'联结与成长';$('#app').innerHTML=`<div class="panel"><div class="eyebrow">你的专属探索报告 · 24/24</div><p class="small">${profile.gender?`性别：${esc(profile.gender)}　·　`:``}MBTI：${profile.mbti?esc(profile.mbti):`未填写`}</p><h1>${core}的<span class="gold">历史回响</span></h1><p class="muted">你的回答呈现出多种并存的倾向，下面是基于24道情境题的解释性画像。</p><div class="profile"><label for="result-gender">历史人物匹配性别（可随时更改，无需重新答题）</label><select id="result-gender"><option value="">不限性别</option>${['女','男','其他','不愿透露'].map(x=>`<option value="${x}" ${profile.gender===x?'selected':''}>${x}</option>`).join('')}</select><small>选择男性时，只显示男性历史人物；选择女性时，只显示女性历史人物。</small></div><div class="note">人物候选范围根据你填写的性别筛选；选择其他、不愿透露或跳过时不限制性别。人物相似度是本网页自定义规则生成的娱乐性分数，不能当作经验证的心理学百分比，也不能证明你与历史人物拥有相同人格。</div><h2 style="margin-top:28px">八维人格雷达图</h2><canvas id="radar" width="360" height="340" role="img" aria-label="八维人格雷达图"></canvas>${NAMES.map((n,i)=>`<div class="trait"><div class="row"><span>${n}</span><strong>${t[i]}/100</strong></div><div class="track"><div class="fill" style="width:${t[i]}%"></div></div></div>`).join('')}<h2 style="margin-top:32px">最相似的三位历史人物</h2>${ranked.slice(0,3).map((p,i)=>`<div class="person"><span class="rank">TOP ${i+1} · 探索性相似度 ${p.score}%</span><h3>${esc(p.name)} · ${esc(p.label)}</h3><p class="muted">${esc(p.about)}</p><div class="small">相似主题：${esc(p.strength)}<br>值得留意：${esc(p.risk)}</div><details class="person-fold" ${i===0?'open':''}><summary>查看与${esc(p.name)}的详细匹配分析</summary><div class="fold-body">${comparison(t,p)}<div class="compare"><p><b class="gold">人物优势分析</b></p><p class="muted">${esc(characterAdvice(p,t).adv)}</p><p><b class="gold">成长建议</b></p><p class="muted">${esc(characterAdvice(p,t).grow)}</p></div></div></details></div>`).join('')}<h2>你的优势与成长空间</h2><p class="muted"><b class="gold">突出倾向：</b>${NAMES[max]}是你当前得分最高的维度之一。这可能成为你应对变化的重要资源。</p><p class="muted"><b class="gold">可探索的方向：</b>${NAMES[min]}相对较低，不代表能力不足，只说明在这套题目中相关选项出现较少。</p><p class="muted"><b class="gold">决策提醒：</b>${risk}</p><h2>感情与事业</h2><p class="muted"><b class="gold">情感模式：</b>${relationship}真实关系仍需结合沟通方式和具体经历判断。</p><p class="muted"><b class="gold">事业倾向：</b>${career}建议在选择机会时同时衡量成长、健康、关系和自由。</p><h2>给你的三条建议</h2><p class="muted">① 用真实经历检验测试标签，不必被单一人物定义。<br>② 面对重大选择时，写下自己的底线和退出条件。<br>③ 允许事业目标、亲密关系与生活幸福随着人生阶段变化。</p><div class="actions"><button class="btn" id="share">分享这个测试</button><button class="btn secondary" id="copy">复制我的结果</button><button class="btn secondary" id="restart">重新测试</button></div><p class="small" id="status" aria-live="polite"></p></div>`;drawRadar(t);$('#result-gender').onchange=e=>{profile.gender=e.target.value;try{localStorage.setItem('history-echo-profile-v1',JSON.stringify(profile))}catch(err){}result()};$('#restart').onclick=()=>{if(confirm('重新测试会清除当前答案，是否继续？')){answers=Array(24).fill(null);save();stage=0;render()}};$('#share').onclick=async()=>{let url=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:'历史回响｜24题人格探索',text:'来测测你最像哪位历史人物！',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);$('#status').textContent='测试链接已复制。上传到网站后，这个链接就能发给朋友。'}else $('#status').textContent='分享地址：'+url}catch(e){if(e.name!=='AbortError')$('#status').textContent='请从浏览器地址栏复制链接。'}};$('#copy').onclick=async()=>{let s=`我的历史人物人格测试结果：${profile.mbti?`MBTI ${profile.mbti}；`:``}${ranked.slice(0,3).map(x=>x.name+' '+x.score+'%').join('、')}。八维人格：${NAMES.map((n,i)=>n+t[i]).join('、')}。测试入口：${location.href.split('#')[0]}`;try{await navigator.clipboard.writeText(s);$('#status').textContent='结果文字已复制！'}catch(e){$('#status').textContent=s}}}
window.startHistoricalQuiz=()=>{stage=0;render()};restore();render();
</script></body></html>
